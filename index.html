        }
        .container {
            flex-grow: 1;

            box-sizing: border-box;
        }
        .ad-spot {
            background-color: #1e293b;
            margin: 15px auto;

            justify-content: center;
            align-items: center;
            border-radius: 8px;
            overflow: hidden;

        }
        .search-box {

        .search-box input {

        .tag-list {

            gap: 10px;

        .tag-item {

            padding: 8px 15px;
            border-radius: 20px;

        }
        .btn-copy {
            background-color: #22c55e;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        @media (max-width: 900px) {
            .sidebar-ad { display: none; }
            .main-layout { padding: 0 10px; }
        }
    </style>
</head>
<body>

    <div class="navbar"><i class="fas fa-fire"></i> ProTags Generator</div>

    <div class="main-layout">

            <script>
                atOptions = { 'key' : '45f3883dd373c2992ffd8f77c09487b4', 'format' : 'iframe', 'height' : 600, 'width' : 160, 'params' : {} };
            </script>
            <script src="https://bauval.org"></script>
        </div>

        <div class="container">
            
            <!-- 🎯 إعلان علوي عملاق (728x90) -->
            <div class="ad-spot" style="max-width: 728px; min-height: 90px;">
                <script>
                    atOptions = { 'key' : '6985c69e1a7650e6f41f0b64dbbfac18', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
                </script>
                <script src="https://bauval.org"></script>
            </div>

            <h2 style="font-size: 2rem; margin-bottom: 5px;">Viral Video Tag & Hashtag Generator</h2>
            <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 0;">Boost your YouTube and TikTok views with trending keywords instantly.</p>

            <!-- 🎯 إعلان وسط مرئي (468x60) -->
            <div class="ad-spot" style="max-width: 468px; min-height: 60px;">
                <script>
                    atOptions = { 'key' : '409e63de330fc9d6fc68cfbbc8e76dbf', 'format' : 'iframe', 'height' : 60, 'width' : 468, 'params' : {} };
                </script>
                <script src="https://bauval.org"></script>
            </div>

            <div class="search-box">
                <input type="text" id="keyword-input" placeholder="Enter your video topic (e.g., gaming, cooking, vlogs)...">
                <button onclick="generateTags()">Generate</button>
            </div>

            <div id="results" class="results-box">
                <h3 style="color: white; margin-top: 0;"><i class="fas fa-check-circle" style="color: #22c55e;"></i> Generated Trending Tags:</h3>
                <div id="tag-container" class="tag-list"></div>
                <button class="btn-copy" onclick="copyTags()"><i class="fas fa-copy"></i> Copy All Tags</button>
            </div>

            <!-- 🎯 إعلان مربع أسفل النتائج (300x250) -->
            <div class="ad-spot" style="max-width: 300px; min-height: 250px;">
                <script>
                    atOptions = { 'key' : 'b36f398609e803de650323a67cd82433', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
                </script>

            <!-- 🎯 إعلان شريطي أخير متوافق للموبايل (320x50) -->

        <!-- 🎯 إعلان يمين معزول للكمبيوتر (160x300) -->

            <script>
                atOptions = { 'key' : '74640c531876df98505317df872719bc', 'format' : 'iframe', 'height' : 300, 'width' : 160, 'params' : {} };
            </script>
            <script src="https://bauval.org"></script>
        </div>

    </div>

    <script>
        function generateTags() {
            const input = document.getElementById('keyword-input').value.trim();
            if (!input) { alert('Please enter a video topic!'); return; }
            
            const baseTags = [input, input+'Tips', input+'2026', input+'Viral', input+'Trending', 'fyp', 'foryou', 'xyzbca', 'trendingvideo', 'creators'];
            const container = document.getElementById('tag-container');
            container.innerHTML = '';
            
            baseTags.forEach(tag => {
                const cleanTag = tag.replace(/\s+/g, '');
                const span = document.createElement('span');
                span.className = 'tag-item';
                span.innerText = '#' + cleanTag.toLowerCase();
                container.appendChild(span);
            });
            
            document.getElementById('results').style.display = 'block';
        }

        function copyTags() {
            const tags = Array.from(document.querySelectorAll('.tag-item')).map(el => el.innerText).join(' ');
            navigator.clipboard.writeText(tags).then(() => {
                alert('All tags copied to clipboard successfully! 🚀');
            });
        }
    </script>

</html>
