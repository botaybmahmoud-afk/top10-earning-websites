<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicVerse AI - Free Ultra-HD Image Generator</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-deep: #060913;
            --bg-panel: #0d1527;
            --accent-neon: #a855f7;
            --accent-blue: #38bdf8;
            --text-light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: linear-gradient(135deg, #0d1527 0%, #060913 100%);
            padding: 18px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-blue);
            border-bottom: 1px solid #1e293b;
        }
        .navbar span { color: var(--accent-neon); }
        .wrapper {
            max-width: 800px;
            margin: 25px auto;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .hero-title h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .ai-generator-panel {
            background-color: var(--bg-panel);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
            box-sizing: border-box;
            text-align: left;
        }
        .ai-input {
            width: 100%;
            padding: 16px;
            background-color: #060913;
            color: #fff;
            border: 1px solid #1e293b;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 18px;
        }
        .generate-btn {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-neon) 100%);
            color: #060913;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            box-sizing: border-box;
            text-align: center;
        }
        .progress-wrapper {
            display: none;
            margin-top: 20px;
            background-color: #060913;
            border-radius: 20px;
            padding: 3px;
            border: 1px solid #1e293b;
            position: relative;
        }
        .progress-bar {
            width: 0%;
            height: 20px;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-neon));
            border-radius: 20px;
            transition: width 0.1s linear;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 4px;
            left: 0;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffffff;
        }
        .result-display {
            display: none;
            margin-top: 25px;
            text-align: center;
        }
        .result-image {
            max-width: 100%;
            max-height: 450px;
            border-radius: 12px;
            border: 2px solid var(--accent-neon);
            margin-bottom: 15px;
        }
        .download-btn {
            background-color: #22c55e;
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="navbar"><i class="fas fa-wand-magic-sparkles"></i> PicVerse <span>AI</span></div>

    <div class="wrapper">
        <div class="hero-title">
            <h1>Free Ultra-HD AI Image Generator</h1>
            <p style="color: #64748b; font-size: 1rem; margin-top: 0;">Turn your imagination into stunning artwork instantly.</p>
        </div>

        <div class="ai-generator-panel">
            <textarea class="ai-input" id="prompt-input" rows="3" placeholder="Describe the image you want to generate (e.g., 'car', 'nature', 'cyberpunk')..."></textarea>
            <button class="generate-btn" onclick="generateAIImage()">Generate AI Masterpiece</button>
            
            <div class="progress-wrapper" id="progress-wrapper">
                <div class="progress-bar" id="bar-fill"></div>
                <div class="progress-text" id="bar-text">0%</div>
            </div>
        </div>

        <div class="result-display" id="result-wrapper">
            <img class="result-image" id="output-image" src="" alt="AI Generated Output">
            <button class="download-btn" onclick="downloadImage()"><i class="fas fa-download"></i> Download Image in Ultra-HD</button>
        </div>
    </div>

    <script>
        let currentImgUrl = "";

        // مكتبة الصور المدمجة فائقة الجودة لضمان العرض الفوري للأجانب وبدون أي حظر خارجي
        const aiDatabase = {
            car: [
                "https://unsplash.com",
                "https://unsplash.com",
                "https://unsplash.com"
            ],
            nature: [
                "https://unsplash.com",
                "https://unsplash.com",
                "https://unsplash.com"
            ],
            cyberpunk: [
                "https://unsplash.com",
                "https://unsplash.com"
            ],
            default: [
                "https://unsplash.com",
                "https://unsplash.com",
                "https://unsplash.com"
            ]
        };

        function generateAIImage() {
            const prompt = document.getElementById('prompt-input').value.trim().toLowerCase();
            if (!prompt) { alert('Please enter a description phrase!'); return; }

            const wrapper = document.getElementById('progress-wrapper');
            const fill = document.getElementById('bar-fill');
            const text = document.getElementById('bar-text');
            const resultWrap = document.getElementById('result-wrapper');
            const outputImg = document.getElementById('output-image');

            resultWrap.style.display = 'none';
            wrapper.style.display = 'block';
            fill.style.width = '0%';
            
            let count = 0;
            const phrases = [
                "Connecting AI Neural Engine...",
                "Synthesizing Pixel Matrix...",
                "Rendering Art Masterpiece..."
            ];

            let timer = setInterval(() => {
                count += Math.floor(Math.random() * 15) + 8;
                if (count >= 100) {
                    count = 100;
                    clearInterval(timer);
                    fill.style.width = '100%';
                    text.innerText = "Generation Succeeded! 100%";

                    // اختيار الصورة الذكية فوراً بناءً على ما كتبه الزائر لضمان سرعة البرق
                    let key = "default";
                    if (prompt.includes("car")) key = "car";
                    else if (prompt.includes("nature")) key = "nature";
                    else if (prompt.includes("cyberpunk") || prompt.includes("neon")) key = "cyberpunk";

                    const pool = aiDatabase[key];
                    currentImgUrl = pool[Math.floor(Math.random() * pool.length)];

                    // معاينة وعرض فوري بدون تأخير
                    setTimeout(() => {
                        wrapper.style.display = 'none';
                        outputImg.src = currentImgUrl;
                        resultWrap.style.display = 'block';
                    }, 300);
                } else {
                    fill.style.width = count + '%';
                    let phraseIndex = Math.floor(count / 40);
                    let currentPhrase = phrases[phraseIndex] || phrases[phrases.length - 1];
                    text.innerText = `${currentPhrase} ${count}%`;
                }
            }, 70);
        }

        async function downloadImage() {
            if (!currentImgUrl) return;
            // فتح الرابط الذكي المربح لـ Binance في صفحة جديدة دون إعاقة التنزيل
            window.open('https://netlify.app', '_blank'); 
            
            const link = document.createElement('a');
            link.href = currentImgUrl;
            link.download = 'AI_Masterpiece.jpg';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
