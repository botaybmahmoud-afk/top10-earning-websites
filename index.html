<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT-DLP - تنزيل الفيديوهات مجاناً وبأعلى جودة</title>
    <!-- استدعاء ستايل أيقونات FontAwesome وتنسيق رائع ومظلم للموقع -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 90%;
            margin-top: 40px;
            text-align: center;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .header i {
            color: #ff0000;
            font-size: 2rem;
        }
        h1 {
            font-size: 1.8rem;
            margin: 10px 0;
            color: #ff3333;
        }
        p.subtitle {
            color: #b3b3b3;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }
        .ad-container {
            margin: 20px auto;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .search-box {
            position: relative;
            margin-bottom: 40px;
        }
        .search-box input {
            width: 100%;
            padding: 15px 45px 15px 100px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: white;
            font-size: 1rem;
        }
        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }
        .search-box button {
            position: absolute;
            left: 5px;
            top: 5px;
            bottom: 5px;
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-box button:hover {
            background-color: #cc0000;
        }
        .footer-text {
            color: #555;
            font-size: 0.85rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر والشعار -->
        <div class="header">
            <i class="fab fa-youtube"></i>
            <span style="font-weight: bold; font-size: 1.5rem;">YT-DLP</span>
        </div>

        <p style="color: #ff3333; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px;">مدعوم من YT-DLP</p>
        <h1>أي شيء قم بتنزيله من يوتيوب</h1>
        <p class="subtitle">ابحث عن مقاطع الفيديو، واستعرضها، واحفظها، أو استخرج الصوت بالتنسيق الذي تفضله. بلا حدود.</p>

        <!-- مساحة إعلانات Adsterra المخصصة لـ 468x60 -->
        <div class="ad-container">
            <script>
              atOptions = {
                'key' : '8294715f561a2240a3e2e03f86f3640b',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
              };
            </script>
            <script src="https://dcengg.org/22/8294715f561a2240a3e2e03f86f3640b"></script>
        </div>

        <!-- صندوق البحث والتحميل -->
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="...ابحث في يوتيوب أو الصق رابطاً">
            <button type="button">يبحث</button>
        </div>

        <div style="margin-top: 60px; color: #888;">
            <i class="fas fa-film" style="font-size: 3rem; color: #333; margin-bottom: 15px;"></i>
            <p style="font-size: 0.9rem;">ابحث عن مقاطع الفيديو للبدء</p>
        </div>

        <div class="footer-text">جميع الحقوق محفوظة لمحمود © 2026</div>
    </div>

</body>
</html>
